server {
    listen 80;

    location = /health {
        default_type text/plain;
        return 200 "ready";
    }

    location = /item {
        default_type text/plain;
        add_header X-CacheOrchestrator-Edge-Cacheable "1" always;
        add_header X-CacheOrchestrator-Edge-Ttl "300" always;
        add_header X-CacheOrchestrator-Edge-Grace "30" always;
        add_header xkey "coe1-integration-item" always;
        return 200 "origin-item";
    }
}
