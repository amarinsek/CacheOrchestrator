name: Publish to NuGet

# Runs ONLY when a GitHub Release is published (not on every push/PR).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # NuGet Trusted Publishing (OIDC) + push Admin image to GHCR.
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
    # Full history helps SourceLink / MinVer embed accurate commit and version metadata.
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore CacheOrchestrator.slnx

    - name: Build
      run: dotnet build CacheOrchestrator.slnx --no-restore --configuration Release

    # Same coverage as build.yml: unit + integration on net8 + net10.
    - name: Unit tests (net8.0)
      run: |
        set -e
        for proj in \
          tests/CacheOrchestrator.Core.UnitTests/CacheOrchestrator.Core.UnitTests.csproj \
          tests/CacheOrchestrator.FusionCache.UnitTests/CacheOrchestrator.FusionCache.UnitTests.csproj \
          tests/CacheOrchestrator.HybridCache.UnitTests/CacheOrchestrator.HybridCache.UnitTests.csproj \
          tests/CacheOrchestrator.AspNetCore.UnitTests/CacheOrchestrator.AspNetCore.UnitTests.csproj \
          tests/CacheOrchestrator.Redis.Shared.UnitTests/CacheOrchestrator.Redis.Shared.UnitTests.csproj \
          tests/CacheOrchestrator.AspNetCore.Redis.UnitTests/CacheOrchestrator.AspNetCore.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.FusionCache.Redis.UnitTests/CacheOrchestrator.FusionCache.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.Redis.UnitTests/CacheOrchestrator.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.HttpBus.UnitTests/CacheOrchestrator.HttpBus.UnitTests.csproj \
          tests/CacheOrchestrator.EFCore.Invalidation.UnitTests/CacheOrchestrator.EFCore.Invalidation.UnitTests.csproj \
          tests/CacheOrchestrator.Analyzers.UnitTests/CacheOrchestrator.Analyzers.UnitTests.csproj
        do
          dotnet test "$proj" --no-build --configuration Release --framework net8.0 --verbosity normal
        done

    - name: Unit tests (net10.0)
      run: |
        set -e
        for proj in \
          tests/CacheOrchestrator.Core.UnitTests/CacheOrchestrator.Core.UnitTests.csproj \
          tests/CacheOrchestrator.FusionCache.UnitTests/CacheOrchestrator.FusionCache.UnitTests.csproj \
          tests/CacheOrchestrator.HybridCache.UnitTests/CacheOrchestrator.HybridCache.UnitTests.csproj \
          tests/CacheOrchestrator.AspNetCore.UnitTests/CacheOrchestrator.AspNetCore.UnitTests.csproj \
          tests/CacheOrchestrator.Redis.Shared.UnitTests/CacheOrchestrator.Redis.Shared.UnitTests.csproj \
          tests/CacheOrchestrator.AspNetCore.Redis.UnitTests/CacheOrchestrator.AspNetCore.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.FusionCache.Redis.UnitTests/CacheOrchestrator.FusionCache.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.Redis.UnitTests/CacheOrchestrator.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.HttpBus.UnitTests/CacheOrchestrator.HttpBus.UnitTests.csproj \
          tests/CacheOrchestrator.EFCore.Invalidation.UnitTests/CacheOrchestrator.EFCore.Invalidation.UnitTests.csproj
        do
          dotnet test "$proj" --no-build --configuration Release --framework net10.0 --verbosity normal
        done

    - name: Admin Console tests (net10.0)
      run: >
        dotnet test tests/CacheOrchestrator.AdminConsole.UnitTests/CacheOrchestrator.AdminConsole.UnitTests.csproj
        --no-build --configuration Release --framework net10.0
        --verbosity normal

    - name: Verify Docker (Testcontainers)
      run: |
        docker version
        docker info

    - name: Integration tests (net8.0 + Redis Testcontainers)
      timeout-minutes: 20
      run: >
        dotnet test tests/CacheOrchestrator.IntegrationTests/CacheOrchestrator.IntegrationTests.csproj
        --no-build --configuration Release --framework net8.0
        --verbosity normal

    - name: Integration tests (net10.0 + Redis Testcontainers)
      timeout-minutes: 20
      run: >
        dotnet test tests/CacheOrchestrator.IntegrationTests/CacheOrchestrator.IntegrationTests.csproj
        --no-build --configuration Release --framework net10.0
        --verbosity normal

    - name: Minimal sample smoke
      timeout-minutes: 5
      run: |
        chmod +x samples/CacheOrchestrator.Minimal/smoke.sh
        bash samples/CacheOrchestrator.Minimal/smoke.sh

    - name: Pack (nupkg + snupkg)
      run: |
        set -e
        mkdir -p nupkg
        # Version comes from MinVer + Git tags (this workflow uses fetch-depth: 0).
        # Create the GitHub Release from the version tag (e.g. v1.0.0).
        # Pack every NuGet library (Admin Console is IsPackable=false — GHCR image below).
        for proj in \
          src/CacheOrchestrator.Core/CacheOrchestrator.Core.csproj \
          src/CacheOrchestrator.AspNetCore/CacheOrchestrator.AspNetCore.csproj \
          src/CacheOrchestrator.FusionCache/CacheOrchestrator.FusionCache.csproj \
          src/CacheOrchestrator.HybridCache/CacheOrchestrator.HybridCache.csproj \
          src/CacheOrchestrator/CacheOrchestrator.csproj \
          src/CacheOrchestrator.Redis.Shared/CacheOrchestrator.Redis.Shared.csproj \
          src/CacheOrchestrator.AspNetCore.Redis/CacheOrchestrator.AspNetCore.Redis.csproj \
          src/CacheOrchestrator.FusionCache.Redis/CacheOrchestrator.FusionCache.Redis.csproj \
          src/CacheOrchestrator.Redis/CacheOrchestrator.Redis.csproj \
          src/CacheOrchestrator.HttpBus/CacheOrchestrator.HttpBus.csproj \
          src/CacheOrchestrator.EFCore.Invalidation/CacheOrchestrator.EFCore.Invalidation.csproj
        do
          dotnet pack "$proj" --configuration Release --no-build --output ./nupkg
        done
        ls -la ./nupkg
        echo "Packed with MinVer-derived version (see nupkg file names)."
        # Expect 11 libraries (.nupkg) + 11 symbol packages (.snupkg).
        nupkg_count=$(ls -1 ./nupkg/*.nupkg | wc -l)
        snupkg_count=$(ls -1 ./nupkg/*.snupkg | wc -l)
        test "$nupkg_count" -eq 11
        test "$snupkg_count" -eq 11

    # NuGet Trusted Publishing: exchange GitHub OIDC token for a temporary API key.
    # Policy on nuget.org must match GitHub Repository Owner/Repo (CacheOrchestrator/CacheOrchestrator)
    # and workflow file publish.yml. Prefer Environment empty unless this job sets environment: ...
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        # nuget.org profile username (not email / not GitHub org) — owns the packages on nuget.org
        user: amarinsek

    - name: Push packages and symbols to NuGet
      run: |
        # Temporary key from NuGet/login (valid ~1 hour, not stored in GitHub Secrets)
        dotnet nuget push ./nupkg/*.nupkg \
          -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
          -s https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push ./nupkg/*.snupkg \
          -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
          -s https://api.nuget.org/v3/index.json \
          --skip-duplicate

    # ── Admin Console container (GHCR) ─────────────────────────────────────
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker metadata (Admin image)
      id: admin-meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/cacheorchestrator-admin-console
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

    - name: Build and push Admin image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/CacheOrchestrator.AdminConsole/Dockerfile
        push: true
        tags: ${{ steps.admin-meta.outputs.tags }}
        labels: ${{ steps.admin-meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.admin-meta.outputs.version }}
