name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Integration suite pulls redis:7-alpine via Testcontainers (first run is slower).
    # Two TFMs run Redis sequentially — allow extra time after the image is cached.
    timeout-minutes: 50

    steps:
    - uses: actions/checkout@v5
      with:
        # Full clone so SourceLink metadata matches a release build more closely.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        # Libraries, unit tests, and integration tests target net8.0 + net10.0.
        # Admin Console App is net10.0-only (its tests run under unit tests net10.0). Samples stay net10.0-only.
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore CacheOrchestrator.slnx

    - name: Build
      run: dotnet build CacheOrchestrator.slnx --no-restore --configuration Release

    - name: Package analyzer consumer smoke
      run: |
        set -e
        mkdir -p .artifacts/package-smoke
        dotnet pack src/CacheOrchestrator.Core/CacheOrchestrator.Core.csproj --no-build --configuration Release --output .artifacts/package-smoke
        dotnet pack src/CacheOrchestrator.FusionCache/CacheOrchestrator.FusionCache.csproj --no-build --configuration Release --output .artifacts/package-smoke
        dotnet pack src/CacheOrchestrator.AspNetCore/CacheOrchestrator.AspNetCore.csproj --no-build --configuration Release --output .artifacts/package-smoke
        dotnet pack src/CacheOrchestrator/CacheOrchestrator.csproj --no-build --configuration Release --output .artifacts/package-smoke
        unzip -l .artifacts/package-smoke/CacheOrchestrator.AspNetCore.*.nupkg | grep -q "analyzers/dotnet/cs/CacheOrchestrator.Analyzers.dll"
        dotnet new classlib --framework net8.0 --output .artifacts/package-consumer
        dotnet add .artifacts/package-consumer/package-consumer.csproj package CacheOrchestrator --source "$GITHUB_WORKSPACE/.artifacts/package-smoke" --prerelease
        cat > .artifacts/package-consumer/Class1.cs <<'EOF'
        using CacheOrchestrator.Identity;

        namespace PackageConsumer;

        public sealed class DuplicateIdentity
        {
          [CacheIdentity(new[] { "GET" }, "first")]
          [CacheIdentity(new[] { "GET" }, "second")]
          public void Execute() { }
        }
        EOF
        if dotnet build .artifacts/package-consumer/package-consumer.csproj 2>&1 | tee .artifacts/package-consumer/build.log; then
          echo "Expected COIDENTITY001 from the packaged analyzer."
          exit 1
        fi
        grep -q "COIDENTITY001" .artifacts/package-consumer/build.log

    # Unit tests multi-target: execute against both packaged TFMs.
    - name: Unit tests (net8.0)
      run: |
        set -e
        for proj in \
          tests/CacheOrchestrator.Core.UnitTests/CacheOrchestrator.Core.UnitTests.csproj \
          tests/CacheOrchestrator.FusionCache.UnitTests/CacheOrchestrator.FusionCache.UnitTests.csproj \
          tests/CacheOrchestrator.HybridCache.UnitTests/CacheOrchestrator.HybridCache.UnitTests.csproj \
          tests/CacheOrchestrator.AspNetCore.UnitTests/CacheOrchestrator.AspNetCore.UnitTests.csproj \
          tests/CacheOrchestrator.Redis.Shared.UnitTests/CacheOrchestrator.Redis.Shared.UnitTests.csproj \
          tests/CacheOrchestrator.AspNetCore.Redis.UnitTests/CacheOrchestrator.AspNetCore.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.FusionCache.Redis.UnitTests/CacheOrchestrator.FusionCache.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.Redis.UnitTests/CacheOrchestrator.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.HttpBus.UnitTests/CacheOrchestrator.HttpBus.UnitTests.csproj \
          tests/CacheOrchestrator.EFCore.Invalidation.UnitTests/CacheOrchestrator.EFCore.Invalidation.UnitTests.csproj \
          tests/CacheOrchestrator.Analyzers.UnitTests/CacheOrchestrator.Analyzers.UnitTests.csproj
        do
          dotnet test "$proj" --no-build --configuration Release --framework net8.0 --verbosity normal
        done

    - name: Unit tests (net10.0)
      run: |
        set -e
        for proj in \
          tests/CacheOrchestrator.Core.UnitTests/CacheOrchestrator.Core.UnitTests.csproj \
          tests/CacheOrchestrator.FusionCache.UnitTests/CacheOrchestrator.FusionCache.UnitTests.csproj \
          tests/CacheOrchestrator.HybridCache.UnitTests/CacheOrchestrator.HybridCache.UnitTests.csproj \
          tests/CacheOrchestrator.AspNetCore.UnitTests/CacheOrchestrator.AspNetCore.UnitTests.csproj \
          tests/CacheOrchestrator.Redis.Shared.UnitTests/CacheOrchestrator.Redis.Shared.UnitTests.csproj \
          tests/CacheOrchestrator.AspNetCore.Redis.UnitTests/CacheOrchestrator.AspNetCore.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.FusionCache.Redis.UnitTests/CacheOrchestrator.FusionCache.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.Redis.UnitTests/CacheOrchestrator.Redis.UnitTests.csproj \
          tests/CacheOrchestrator.HttpBus.UnitTests/CacheOrchestrator.HttpBus.UnitTests.csproj \
          tests/CacheOrchestrator.EFCore.Invalidation.UnitTests/CacheOrchestrator.EFCore.Invalidation.UnitTests.csproj
        do
          dotnet test "$proj" --no-build --configuration Release --framework net10.0 --verbosity normal
        done

    # Admin Console App is net10.0-only (separate test project).
    - name: Admin Console tests (net10.0)
      run: >
        dotnet test tests/CacheOrchestrator.AdminConsole.UnitTests/CacheOrchestrator.AdminConsole.UnitTests.csproj
        --no-build --configuration Release --framework net10.0
        --verbosity normal

    # GitHub-hosted runners include Docker — required for Testcontainers.Redis.
    - name: Verify Docker (Testcontainers)
      run: |
        docker version
        docker info

    # Integration: both packaged TFMs. Redis tests start redis:7-alpine via Testcontainers
    # (shared RedisFixture collection + multi-instance dual-container tests).
    - name: Integration tests (net8.0 + Redis Testcontainers)
      timeout-minutes: 20
      env:
        # Clearer logs if a container fails to start.
        TESTCONTAINERS_RYUK_DISABLED: "false"
      run: >
        dotnet test tests/CacheOrchestrator.IntegrationTests/CacheOrchestrator.IntegrationTests.csproj
        --no-build --configuration Release --framework net8.0
        --verbosity normal
        --logger "console;verbosity=detailed"

    - name: Integration tests (net10.0 + Redis Testcontainers)
      timeout-minutes: 20
      env:
        TESTCONTAINERS_RYUK_DISABLED: "false"
      run: >
        dotnet test tests/CacheOrchestrator.IntegrationTests/CacheOrchestrator.IntegrationTests.csproj
        --no-build --configuration Release --framework net10.0
        --verbosity normal
        --logger "console;verbosity=detailed"

    # README "Try it in one minute" path: live process + curl miss → hit (InMemory, no Redis).
    - name: Minimal sample smoke
      timeout-minutes: 5
      run: |
        chmod +x samples/CacheOrchestrator.Minimal/smoke.sh
        bash samples/CacheOrchestrator.Minimal/smoke.sh
