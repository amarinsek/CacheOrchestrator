# Local Prometheus for Admin App Metrics + Minimal sample.
#
#   docker compose -f deploy/prometheus/docker-compose.yml up -d
#
# UI:  http://localhost:9090
# Scrapes host playground at http://host.docker.internal:5289/metrics
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: cacheorchestrator-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Linux Docker: resolve host.docker.internal to the host machine
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    restart: unless-stopped
