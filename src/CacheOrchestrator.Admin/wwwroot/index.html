<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CacheOrchestrator Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!--
    Chrome layout (top → bottom):
    1) app logo / brand (same pattern as Sample Playground)
    2) header metrics strip (same bar style as menu)
    3) menu strip
  -->
  <div class="app-chrome" id="appChrome">
    <div class="chrome-brand">
      <a href="#/overview" class="brand-link">
        <img src="/logo.png" alt="CacheOrchestrator logo" class="brand-logo" width="56" height="56" />
        <span class="brand-text">
          <span class="brand-eyebrow">CacheOrchestrator</span>
          <h1 class="brand-title">Admin Console</h1>
          <span class="brand-subtitle">Multi-instance fan-out · live stats · operations</span>
        </span>
      </a>
    </div>

    <div class="chrome-strip chrome-metrics" id="headerMetrics">
      <span class="hm muted">Loading…</span>
    </div>

    <nav class="chrome-strip app-nav" id="appNav">
      <div class="nav-left">
        <a href="#/overview" data-nav="overview" title="Cluster snapshot: instances, top domains/endpoints, pipeline">Overview</a>
        <a href="#/instances" data-nav="instances" title="Configured target apps and health probes">Instances</a>
        <a href="#/domains" data-nav="domains" title="Cache domains — policy groups (TTL, version, providers)">Domains</a>
        <a href="#/endpoints" data-nav="endpoints" title="Routes with cache counters (method + template)">Endpoints</a>
        <a href="#/metrics" data-nav="metrics" title="Windowed charts from optional Prometheus-compatible store">Metrics</a>
      </div>
      <div class="nav-right">
        <a href="#/hints" data-nav="hints" class="nav-hints" title="Recommendation hints after fan-out aggregation">
          <span data-nav-hints-badge class="nav-hints-badge"><span class="sev-stack empty">○</span></span>
          Hints
        </a>
        <div class="nav-refresh" title="Auto-refresh interval for soft page reload">
          <select id="selAutoRefresh" aria-label="Auto refresh">
            <option value="0">Off</option>
            <option value="5">5 s</option>
            <option value="10">10 s</option>
            <option value="30">30 s</option>
            <option value="60">1 m</option>
            <option value="300">5 m</option>
          </select>
          <button type="button" id="btnHeaderRefresh" title="Refresh now">↻</button>
        </div>
        <a href="#/operations" data-nav="operations" title="Invalidate, version/TTL overlay, cluster bus distribute">Operations</a>
        <a href="#/settings" data-nav="settings" title="Hint rule packs, enable/disable codes">Settings</a>
        <a href="/scalar/v1" target="_blank" rel="noopener" class="nav-api" title="OpenAPI document for Admin App HTTP API">API</a>
      </div>
    </nav>
  </div>

  <div class="breadcrumb muted" id="breadcrumb"></div>

  <main id="appMain" class="app-main">
    <p class="muted">Loading…</p>
  </main>

  <footer class="app-footer muted">
    Local Admin must be enabled on each app. Configure <code>CacheAdmin:Instances</code>.
  </footer>

  <!-- ES modules: see wwwroot/js/app.js for the module graph -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
