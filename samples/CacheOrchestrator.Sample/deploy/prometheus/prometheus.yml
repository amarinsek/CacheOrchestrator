# Scrape CacheOrchestrator.Sample (playground) on the host (not inside Docker).
# From the container, localhost is the container itself — use host.docker.internal.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cacheorchestrator-playground
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - host.docker.internal:5289
        labels:
          app: playground
          instance_id: local-playground
