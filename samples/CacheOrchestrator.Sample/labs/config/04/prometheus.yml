global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: playground
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["playground-a:8080"]
        labels:
          app: playground
          instance_id: playground-a
      - targets: ["playground-b:8080"]
        labels:
          app: playground
          instance_id: playground-b
