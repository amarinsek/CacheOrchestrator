# Stage 04 — Two instances + Redis L2 + HTTP cluster bus
#   docker compose -f samples/CacheOrchestrator.Sample/labs/compose/04-bus.yml up --build -d
#
# Shared appsettings: named volume at /shared (see stage 03). Seed: config/04/appsettings.seed.json

name: co-lab-04

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [lab]

  appsettings-init:
    image: busybox:1.36
    volumes:
      - ../config/04/appsettings.seed.json:/seed/appsettings.json:ro
      - playground-appsettings:/shared
    command:
      - sh
      - -c
      - |
        if [ ! -f /shared/appsettings.json ]; then
          cp /seed/appsettings.json /shared/appsettings.json
        fi
        chmod 666 /shared/appsettings.json
    networks: [lab]

  playground-a:
    build:
      context: ../../../..
      dockerfile: samples/CacheOrchestrator.Sample/Dockerfile
    image: cacheorchestrator-playground:local
    ports:
      - "5289:8080"
    environment:
      Cache__InstanceId: playground-a
    volumes:
      - ../config/04/playground.Production.json:/app/appsettings.Production.json:ro
      - playground-appsettings:/shared
    depends_on:
      redis:
        condition: service_started
      appsettings-init:
        condition: service_completed_successfully
    networks: [lab]

  playground-b:
    image: cacheorchestrator-playground:local
    ports:
      - "5290:8080"
    environment:
      Cache__InstanceId: playground-b
    volumes:
      - ../config/04/playground.Production.json:/app/appsettings.Production.json:ro
      - playground-appsettings:/shared
    depends_on:
      redis:
        condition: service_started
      appsettings-init:
        condition: service_completed_successfully
      playground-a:
        condition: service_started
    networks: [lab]

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ../config/04/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks: [lab]

  admin:
    build:
      context: ../../../..
      dockerfile: src/CacheOrchestrator.AdminConsole/Dockerfile
    image: cacheorchestrator-admin-console:local
    ports:
      - "5188:8080"
    environment:
      AdminConsole__ApiKey: dev-admin-key
    volumes:
      - ../config/04/admin.Production.json:/app/appsettings.Production.json:ro
    depends_on:
      - playground-a
      - playground-b
      - prometheus
    networks: [lab]

networks:
  lab:

volumes:
  playground-appsettings:
